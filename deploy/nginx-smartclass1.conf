# Nginx 配置文件 - smartclass1.top
# 安装路径: /etc/nginx/sites-available/smartclass1
#           （Debian/Ubuntu 用 sites-available + sites-enabled 软链；
#             RHEL/CentOS 没有这套机制，需放到 /etc/nginx/conf.d/smartclass1.conf）
#
# ⚠️ 两条容易踩的 nginx 规则，本文件已针对性处理，改动时请勿回退：
#   1) add_header 不继承：只要某个 location 里写了任何 add_header，server 级的
#      add_header 就对该 location 全部失效。所以凡是自己写 add_header 的 location，
#      都必须把安全头重复一遍。
#   2) location 前缀匹配：/ws/ 匹配不到 /ws-asr/ 和 /ws-signal/。三个 WebSocket
#      端点必须一起覆盖，否则字幕与信令握手失败。
#   3) 本文件引用的 Let's Encrypt 证书在首次部署时尚不存在，nginx -t 会失败。
#      必须先跑 certbot 再启用本文件（deploy.sh 已按此顺序处理）。

# WebSocket 升级头。map 必须位于 http 上下文；sites-enabled 里的文件正是被
# include 进 http{} 的，所以可以直接写在这里。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP 自动重定向到 HTTPS
server {
    listen 80;
    server_name smartclass1.top www.smartclass1.top;

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name smartclass1.top www.smartclass1.top;

    # SSL 证书配置 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/smartclass1.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartclass1.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # SSL 优化
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 日志配置
    access_log /var/log/nginx/smartclass1-access.log;
    error_log /var/log/nginx/smartclass1-error.log;

    # 客户端上传大小限制 (支持视频上传)
    client_max_body_size 200M;
    client_body_buffer_size 10M;

    # 超时设置
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # 根路径 - 代理到 FastAPI 应用
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用缓存 (动态内容)
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ===== WebSocket：必须覆盖全部三个端点 =====
    # /ws/{username}/{meeting_id}        主通道
    # /ws-asr/{username}/{meeting_id}    实时字幕（PCM 上行）
    # /ws-signal/{username}/{meeting_id} 信令（连麦协商）
    # 用正则一次性覆盖三者；漏掉 /ws-asr/ 或 /ws-signal/ 会导致它们落到
    # location / ，那里没有 Upgrade/Connection 头，握手直接失败。
    location ~ ^/ws(-asr|-signal)?/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket 必需的 headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接保持
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_buffering off;
    }

    # ===== SSE 流式接口：必须关闭缓冲 =====
    # /api/ai-tutor-stream 与 /api/generate-report-stream 返回 text/event-stream。
    # nginx 默认开启 proxy_buffering，会把流式响应攒在缓冲区里，前端表现为一直转圈。
    # 这两个 location 不写 add_header，因此继承 server 级安全头。
    location = /api/ai-tutor-stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/generate-report-stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态文件 - storage 目录 (视频、音频、快照)
    # 本块只用 expires，不写 add_header —— expires 已会输出 Cache-Control，
    # 再 add_header 一个 Cache-Control 会重复，而且会连带顶掉 server 级安全头。
    location /storage/ {
        proxy_pass http://127.0.0.1:8000/storage/;
        expires 1h;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # API 路由优化
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API 响应不缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # ⚠️ 下面四个安全头必须重复一遍 —— 本块有自己的 add_header，
        #    不会再继承 server 级的那几个。删掉即等于 API 响应裸奔。
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # 安全头部 (对所有未自行 add_header 的 location 生效：/、/ws*、/storage/、两个 SSE)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
}
